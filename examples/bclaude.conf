# shellcheck shell=bash
# Options of bclaude.sh. Copy to ~/.config/bclaude/config (or
# $XDG_CONFIG_HOME/bclaude/config) and uncomment what you change. Every
# commented value below is the default.
#
# bclaude.sh sources this file as bash, on the host, before anything is
# mounted. It runs under `set -eufo pipefail`: a failing command stops the
# launch, an unset variable is an error, globs do not expand.
#
# The environment wins over this file, so one run can differ:
#     BCLAUDE_PNPM=0 bclaude
#
# Readable here, never assignable:
#     PROJECT       the launch directory, symlinks resolved
#     REAL_HOME     your home, symlinks resolved
#     BCLAUDE_PATH  the bubbleclaude repo
#
# Keep every file named here outside your projects and outside the sandbox
# home: a session could write it there, so bclaude.sh refuses to launch.

# The fake home: OAuth session, history, per-project trust.
#SANDBOX_HOME="$BCLAUDE_PATH/claude-home"

# The claude binary, instead of the one on PATH.
#CLAUDE_BIN="$REAL_HOME/.local/bin/claude"

# 1 skips `claude update` on the host before each launch. Default: unset.
#DISABLE_AUTOUPDATER=1

# The policy bound as managed settings: inner sandbox and network allowlist.
# Nothing checks a replacement: start from a copy of the shipped file and keep
# its `sandbox` block, or the session runs with no inner sandbox at all.
#BCLAUDE_MANAGED_SETTINGS="$BCLAUDE_PATH/managed-settings.json"

# The global instructions bound read-only at ~/.claude/CLAUDE.md inside.
#BCLAUDE_CLAUDE_MD="$REAL_HOME/.claude/CLAUDE.md"

# Limits of the systemd scope, in systemd's own syntax.
#BCLAUDE_MEMORY_MAX=8G
#BCLAUDE_TASKS_MAX=1024
#BCLAUDE_CPU_WEIGHT=25

# Size of /tmp and of /var/tmp, in bytes. Both are RAM.
#BCLAUDE_TMP_SIZE=2147483648

# What is bound read-only from your real home: 1 binds, 0 leaves it out.
# ~/.gitconfig and ~/.config/git/config
#BCLAUDE_GITCONFIG=1
# ~/.local/bin, first on PATH
#BCLAUDE_LOCAL_BIN=1
# ~/.nvm. 0 is refused when claude itself is installed there.
#BCLAUDE_NVM=1
# ~/.local/share/pnpm, its bin/ last on PATH
#BCLAUDE_PNPM=1


